<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship JavaScript</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrapper">
    <div class="top-bar">
      <img src="icons/logo.svg" class="logo">
      <div class="end">
        <div class="scoreline">
          <div class="player">
            <p>YOU</p>
            <p class="human-score"></p>
          </div>
          <p class="vs">VS</p>
          <div class="opponent">
            <p>OPPONENT</p>
            <p class="comp-score"></p>
          </div>
        </div>
        <div class="action-btns">
          <button class="new-game">
            <img src="icons/sync.svg">
            New Game
          </button>
          <button class="restart">
            <img src="icons/restart.svg">
            Restart
          </button>
        </div>
      </div>
    </div>
    <div class="mobile-header">
      <img src="icons/logo.svg" class="logo">

      <button class="menu-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
          <path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z" />
        </svg>
      </button>
    </div>
    <div class="side-bar">
      <div class="human-fleet">
        <p class="title">YOUR FLEET</p>
        <ul>
          <li>
            <img src="icons/carrier.svg">
            Carrier
            <div class="count">1</div>
          </li>
          <li>
            <img src="icons/battleship.svg">
            Battleship
            <div class="count">1</div>
          </li>
          <li>
            <img src="icons/submarine.svg">
            Submarine
            <div class="count">1</div>
          </li>
          <li>
            <img src="icons/cruiser.svg">
            Cruiser
            <div class="count">1</div>
          </li>
          <li>
            <img src="icons/destroyer.svg">
            Destroyer
            <div class="count">1</div>
          </li>
        </ul>
      </div>

      <div class="scoreline-cont">
        <p class="title">SCORELINE</p>
        <div class="scoreline">
          <div class="player">
            <p>YOU</p>
            <p class="human-score"></p>
          </div>
          <p class="vs">VS</p>
          <div class="opponent">
            <p>OPPONENT</p>
            <p class="comp-score"></p>
          </div>
        </div>
      </div>

      <div class="key-cont">
        <p class="title">KEY</p>
        <div class="key">
          <div class="ship"></div>
          <div class="label">Ship</div>
          <div class="hit"></div>
          <div class="label">Hit</div>
          <div class="water"></div>
          <div class="label">Water</div>
        </div>
      </div>
    </div>
    <div class="main">
      <div class="plyr1-board-container board-container">
        <div class="head">
          <div class="playr-name">
            <img src="icons/player.svg">
            YOUR FLEET
          </div>
          <div class="turn-indicator active">
            <div class="dot"></div>
            <span>YOUR TURN</span>
          </div>
        </div>
        <div class="plyr1-board"></div>
      </div>
      <div class="plyr2-board-container board-container">
        <div class="head">
          <div class="playr-name">
            <img src="icons/robot-thinking.svg">
            ENEMY WATERS
          </div>
          <div class="turn-indicator">
            <div class="dot"></div>
            <span>OPPONENT</span>
          </div>
        </div>
        <div class="plyr2-board"></div>
      </div>
    </div>
    <div class="bottom-panel">
      <p class="turn">
        <img src="icons/robot-thinking.svg" class="thinking-icon" hidden>
        <img src="icons/target.svg" class="human-icon" hidden>
        <img src="icons/trophy.svg" class="win-icon" hidden>

        <span class="turn-text"></span>
      </p>
    </div>
    <div class="action-btns">
      <button class="new-game">
        <img src="icons/sync.svg">
        New Game
      </button>
      <button class="restart">
        <img src="icons/restart.svg">
        Restart
      </button>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
