<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="#06d9ef"
  role="img" aria-label="Computer is thinking" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest>
      </c2pa:manifest>
  </metadata>
  <title>Computer is thinking</title>
  <style>
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s infinite;
    }
    .dot { animation: dot 1.2s infinite; }
    .d2  { animation-delay: .2s; }
    .d3  { animation-delay: .4s; }
    .beacon { animation: pulse 1.6s ease-in-out infinite; }

    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.1); }
    }
    @keyframes dot {
      0%, 80%, 100% { opacity: .25; }
      40%           { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .3; }
    }
    @media (prefers-reduced-motion: reduce) {
      .eye, .dot, .beacon { animation: none; }
    }
  </style>

  <!-- antenna -->
  <rect x="31" y="8" width="2" height="8" />
  <circle class="beacon" cx="32" cy="7" r="3.5" />

  <!-- ears -->
  <rect x="7" y="29" width="6" height="12" rx="2.5" />
  <rect x="51" y="29" width="6" height="12" rx="2.5" />

  <!-- neck -->
  <rect x="23" y="54" width="18" height="4" rx="2" />

  <!-- head with screen cut-out -->
  <path fill-rule="evenodd"
    d="
    M21 16 H43 A9 9 0 0 1 52 25 V45 A9 9 0 0 1 43 54 H21 A9 9 0 0 1 12 45 V25 A9 9 0 0 1 21 16 Z
    M24 24 H40 A6 6 0 0 1 46 30 V42 A6 6 0 0 1 40 48 H24 A6 6 0 0 1 18 42 V30 A6 6 0 0 1 24 24 Z" />

  <!-- eyes (blink) -->
  <rect class="eye" x="23" y="29" width="6" height="9" rx="3" />
  <rect class="eye" x="35" y="29" width="6" height="9" rx="3" />

  <!-- thinking dots -->
  <circle class="dot d1" cx="28" cy="43" r="1.5" />
  <circle class="dot d2" cx="32" cy="43" r="1.5" />
  <circle class="dot d3" cx="36" cy="43" r="1.5" />
</svg>