<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 86" width="200" height="86" role="img"
  aria-label="Fleet Command Battleship" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest>
      </c2pa:manifest>
  </metadata>
  <title>Fleet Command Battleship</title>

  <!-- Background plate -->
  <rect x="1" y="1" width="298" height="84" rx="8" fill="transparent" stroke="none"
    stroke-width="1.5" />

  <!-- Ship icon -->
  <g transform="translate(18 17)" fill="#06d9ef">
    <!-- mast -->
    <rect x="28.5" y="0" width="2" height="9" />
    <!-- funnel -->
    <rect x="25" y="8" width="9" height="6" rx="1" />
    <!-- bridge -->
    <rect x="19" y="14" width="21" height="9" rx="1.5" />
    <!-- lower deckhouse -->
    <rect x="9" y="23" width="38" height="8" rx="1.5" />
    <!-- bow turret and barrel -->
    <rect x="49" y="24" width="12" height="3" rx="1.5" />
    <circle cx="50" cy="26.5" r="4" />
    <!-- hull -->
    <path d="M1 31 H63 L55 43 H11 Z" />
    <!-- windows (cut-outs) -->
    <g fill="#0a1628">
      <rect x="22" y="17" width="4" height="3" rx="0.6" />
      <rect x="28" y="17" width="4" height="3" rx="0.6" />
      <rect x="34" y="17" width="3" height="3" rx="0.6" />
      <rect x="13" y="26" width="4" height="2.6" rx="0.6" />
      <rect x="20" y="26" width="4" height="2.6" rx="0.6" />
      <rect x="27" y="26" width="4" height="2.6" rx="0.6" />
      <rect x="34" y="26" width="4" height="2.6" rx="0.6" />
    </g>
    <!-- waves -->
    <g fill="none" stroke="#06d9ef" stroke-width="2" stroke-linecap="round">
      <path d="M2 48 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0 t10 0" />
      <path d="M10 53 q5 -4 10 0 t10 0 t10 0 t10 0 t10 0" opacity="0.55" />
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="100" y="33" font-size="10" font-weight="500" fill="#7f9bb8"
      textLength="150" lengthAdjust="spacing">FLEET COMMAND</text>
    <text x="100" y="62" font-size="27" font-weight="700" fill="#ffffff"
      textLength="184" lengthAdjust="spacing">BATTLESHIP</text>
  </g>
</svg>